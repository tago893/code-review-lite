# Experiment only. Used as CRL_COMPOSE_EXTRA with docker/run.sh: the same prep, proxy and agent containers (same
# hardening, same networks, same read-only snapshot), but the agent runs the lean reviewer instead of the OpenCode CLI.
# The compiled experiment (npm run in experiments/lean: tsc -p experiments/lean/tsconfig.json) is mounted read-only, so
# the agent image is not rebuilt and the production Dockerfile is untouched. Paths here are relative to docker/.
services:
  agent:
    command:
      - node
      - /opt/crl/lean/experiments/lean/run.js
      - --repo
      - /repo
      - --ctx
      - /review/context
      - --prompts
      - /opt/crl/prompts
      - --out
      - /review/out
      - --category
      # The bug-finding assistant by default; LEAN_CATEGORY=security runs the security assistant (the SQL-injection demo).
      - ${LEAN_CATEGORY:-code_quality}
    environment:
      - LEAN_REQUEST_BUDGET_BYTES
      - LEAN_HISTORY_BYTES
      - LEAN_MAX_FORBIDDEN_CALLS
      # Debug only: CRA_DEBUG_TRANSCRIPT=1 writes lean-transcript.private.jsonl (source code and raw model output).
      - CRA_DEBUG_TRANSCRIPT
      # Which reviewer code ran (the container has no .git). Set by `source experiments/lean/reviewer-env.sh`; recorded in
      # the result's provenance, and null when absent.
      - CRA_REVIEWER_COMMIT
      - CRA_REVIEWER_DIRTY
    volumes:
      - ../dist-lean:/opt/crl/lean:ro
  stub:
    environment:
      - STUB_429_AT
